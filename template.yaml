AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: AI Branding Chatbot - Complete Serverless Agent-Based Architecture

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [local, dev, prod]
    Description: Deployment environment

  ProjectName:
    Type: String
    Default: ai-branding-chatbot
    Description: Project name for resource naming

  BedrockRegion:
    Type: String
    Default: us-east-1
    Description: AWS region for Bedrock services

  ClaudeModelId:
    Type: String
    Default: us.anthropic.claude-sonnet-4-20250514-v1:0
    Description: Bedrock Claude Sonnet 4 inference profile for reasoning and text generation

  SdxlModelId:
    Type: String
    Default: stability.stable-diffusion-xl-v1
    Description: Bedrock SDXL model ID for image generation

  BedrockKnowledgeBaseId:
    Type: String
    Default: ""
    Description: Bedrock Knowledge Base ID (optional, leave empty for local development)

  BedrockAgentId:
    Type: String
    Default: ""
    Description: Bedrock Agent ID for AgentCore (optional, leave empty for local development)

  BedrockAgentAliasId:
    Type: String
    Default: ""
    Description: Bedrock Agent Alias ID for AgentCore (optional, leave empty for local development)

  EnableFallback:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Enable fallback to OpenAI/Gemini (true for dev, false for production)

Globals:
  Function:
    Runtime: python3.9
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        PROJECT_NAME: !Ref ProjectName
        DYNAMODB_TABLE: !Ref WorkflowSessionsTable
        S3_BUCKET: !Ref BrandingAssetsBucket
        LOG_LEVEL: INFO
        # Bedrock Configuration
        BEDROCK_REGION: !Ref BedrockRegion
        CLAUDE_MODEL_ID: !Ref ClaudeModelId
        SDXL_MODEL_ID: !Ref SdxlModelId
        BEDROCK_KB_ID: !Ref BedrockKnowledgeBaseId
        BEDROCK_AGENT_ID: !Ref BedrockAgentId
        BEDROCK_AGENT_ALIAS_ID: !Ref BedrockAgentAliasId
        ENABLE_FALLBACK: !Ref EnableFallback
    Layers:
      - !Ref SharedUtilitiesLayer

Resources:
  # API Gateway HTTP API (cost-optimized)
  BrandingApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      CorsConfiguration:
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
          - X-Amz-Date
          - X-Api-Key
          - X-Amz-Security-Token
        AllowOrigins:
          - "*"
      Tags:
        Environment: !Ref Environment
        Project: !Ref ProjectName

  # Shared Lambda Layer for common utilities
  SharedUtilitiesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "${ProjectName}-shared-utilities-${Environment}"
      Description: Shared utilities for all agent functions
      ContentUri: src/lambda/shared/
      CompatibleRuntimes:
        - python3.9
      RetentionPolicy: Delete

  # IAM Policy for Bedrock Access
  BedrockAccessPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${ProjectName}-bedrock-access-${Environment}"
      Description: IAM policy for Amazon Bedrock access (Claude, SDXL, Knowledge Base, AgentCore)
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Bedrock Model Invocation (Claude, SDXL)
          - Sid: BedrockModelInvocation
            Effect: Allow
            Action:
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
              - bedrock:ListFoundationModels
              - bedrock:GetFoundationModel
            Resource:
              - !Sub "arn:aws:bedrock:${BedrockRegion}::foundation-model/*"

          # Bedrock Knowledge Base Access
          - Sid: BedrockKnowledgeBase
            Effect: Allow
            Action:
              - bedrock:Retrieve
              - bedrock:RetrieveAndGenerate
            Resource:
              - !Sub "arn:aws:bedrock:${BedrockRegion}:${AWS::AccountId}:knowledge-base/*"

          # Bedrock Agent Runtime (AgentCore)
          - Sid: BedrockAgentRuntime
            Effect: Allow
            Action:
              - bedrock-agent-runtime:InvokeAgent
              - bedrock-agent-runtime:Retrieve
            Resource:
              - !Sub "arn:aws:bedrock:${BedrockRegion}:${AWS::AccountId}:agent/*"
              - !Sub "arn:aws:bedrock:${BedrockRegion}:${AWS::AccountId}:agent-alias/*"

          # CloudWatch Logging & Metrics
          - Sid: CloudWatchAccess
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
              - cloudwatch:PutMetricData
            Resource: "*"

  # Agent Lambda Functions
  SupervisorAgent:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-supervisor-agent-${Environment}"
      CodeUri: src/lambda/agents/supervisor/
      Handler: index.lambda_handler
      Description: Supervisor Agent - Workflow monitoring and control
      Events:
        StatusApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref BrandingApi
            Path: /status/{id}
            Method: get
        SessionsApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref BrandingApi
            Path: /sessions
            Method: post
        SessionGetApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref BrandingApi
            Path: /sessions/{id}
            Method: get
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref WorkflowSessionsTable
        - S3ReadPolicy:
            BucketName: !Ref BrandingAssetsBucket
        - StepFunctionsExecutionPolicy:
            StateMachineName: !GetAtt BrandingWorkflow.Name
        - !Ref BedrockAccessPolicy

  ProductInsightAgent:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-product-insight-agent-${Environment}"
      CodeUri: src/lambda/agents/product-insight/
      Handler: index.lambda_handler
      Description: Product Insight Agent - Business analysis
      Events:
        AnalysisApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref BrandingApi
            Path: /analysis
            Method: post
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref WorkflowSessionsTable
        - S3ReadPolicy:
            BucketName: !Ref BrandingAssetsBucket
        - !Ref BedrockAccessPolicy

  MarketAnalystAgent:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-market-analyst-agent-${Environment}"
      CodeUri: src/lambda/agents/market-analyst/
      Handler: index.lambda_handler
      Description: Market Analyst Agent - Market trends analysis
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref WorkflowSessionsTable
        - !Ref BedrockAccessPolicy

  ReporterAgent:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-reporter-agent-${Environment}"
      CodeUri: src/lambda/agents/reporter/
      Handler: index.lambda_handler
      Description: Reporter Agent - Business name suggestions
      Events:
        NamesApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref BrandingApi
            Path: /names/suggest
            Method: post
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref WorkflowSessionsTable
        - !Ref BedrockAccessPolicy

  SignboardAgent:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-signboard-agent-${Environment}"
      CodeUri: src/lambda/agents/signboard/
      Handler: index.lambda_handler
      Description: Signboard Agent - Signboard design generation
      Timeout: 60
      MemorySize: 1024
      Events:
        SignboardsApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref BrandingApi
            Path: /signboards/generate
            Method: post
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref WorkflowSessionsTable
        - S3CrudPolicy:
            BucketName: !Ref BrandingAssetsBucket
        - !Ref BedrockAccessPolicy

  InteriorAgent:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-interior-agent-${Environment}"
      CodeUri: src/lambda/agents/interior/
      Handler: index.lambda_handler
      Description: Interior Agent - Interior design recommendations
      Timeout: 60
      MemorySize: 1024
      Events:
        InteriorsApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref BrandingApi
            Path: /interiors/generate
            Method: post
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref WorkflowSessionsTable
        - S3CrudPolicy:
            BucketName: !Ref BrandingAssetsBucket
        - !Ref BedrockAccessPolicy

  ReportGeneratorAgent:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-report-generator-agent-${Environment}"
      CodeUri: src/lambda/agents/report-generator/
      Handler: index.lambda_handler
      Description: Report Generator Agent - PDF report generation
      Timeout: 120
      MemorySize: 2048
      PackageType: Zip
      Events:
        ReportApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref BrandingApi
            Path: /report/generate
            Method: post
        ReportUrlApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref BrandingApi
            Path: /report/url
            Method: get
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref WorkflowSessionsTable
        - S3CrudPolicy:
            BucketName: !Ref BrandingAssetsBucket
        - !Ref BedrockAccessPolicy

  # Step Functions State Machine
  BrandingWorkflow:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub "${ProjectName}-workflow-${Environment}"
      DefinitionUri: statemachine/branding-workflow.asl.json
      DefinitionSubstitutions:
        ProductInsightAgentArn: !GetAtt ProductInsightAgent.Arn
        MarketAnalystAgentArn: !GetAtt MarketAnalystAgent.Arn
        ReporterAgentArn: !GetAtt ReporterAgent.Arn
        SignboardAgentArn: !GetAtt SignboardAgent.Arn
        InteriorAgentArn: !GetAtt InteriorAgent.Arn
        ReportGeneratorAgentArn: !GetAtt ReportGeneratorAgent.Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref ProductInsightAgent
        - LambdaInvokePolicy:
            FunctionName: !Ref MarketAnalystAgent
        - LambdaInvokePolicy:
            FunctionName: !Ref ReporterAgent
        - LambdaInvokePolicy:
            FunctionName: !Ref SignboardAgent
        - LambdaInvokePolicy:
            FunctionName: !Ref InteriorAgent
        - LambdaInvokePolicy:
            FunctionName: !Ref ReportGeneratorAgent

  # DynamoDB Table for session management
  WorkflowSessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-sessions-${Environment}"
      AttributeDefinitions:
        - AttributeName: sessionId
          AttributeType: S
        - AttributeName: currentStep
          AttributeType: N
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: sessionId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      GlobalSecondaryIndexes:
        - IndexName: StepIndex
          KeySchema:
            - AttributeName: currentStep
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName

  # S3 Bucket for assets storage
  BrandingAssetsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-assets-${Environment}-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: DeleteIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: DeleteOldVersions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 30
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName

  # CloudWatch Log Groups for structured logging
  SupervisorAgentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${SupervisorAgent}"
      RetentionInDays: 14

  ProductInsightAgentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProductInsightAgent}"
      RetentionInDays: 14

  MarketAnalystAgentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${MarketAnalystAgent}"
      RetentionInDays: 14

  ReporterAgentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ReporterAgent}"
      RetentionInDays: 14

  SignboardAgentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${SignboardAgent}"
      RetentionInDays: 14

  InteriorAgentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${InteriorAgent}"
      RetentionInDays: 14

  ReportGeneratorAgentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ReportGeneratorAgent}"
      RetentionInDays: 14

Outputs:
  ApiEndpoint:
    Description: API Gateway HTTP API endpoint
    Value: !Sub "https://${BrandingApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
    Export:
      Name: !Sub "${ProjectName}-api-endpoint-${Environment}"

  DynamoDBTableName:
    Description: DynamoDB table name for sessions
    Value: !Ref WorkflowSessionsTable
    Export:
      Name: !Sub "${ProjectName}-dynamodb-table-${Environment}"

  S3BucketName:
    Description: S3 bucket name for assets
    Value: !Ref BrandingAssetsBucket
    Export:
      Name: !Sub "${ProjectName}-s3-bucket-${Environment}"

  StateMachineArn:
    Description: Step Functions state machine ARN
    Value: !Ref BrandingWorkflow
    Export:
      Name: !Sub "${ProjectName}-statemachine-arn-${Environment}"
