AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: AI Branding Chatbot - Complete Serverless Agent-Based Architecture

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
    Description: Deployment environment (dev for development, prod for production)

  ProjectName:
    Type: String
    Default: ai-branding-chatbot
    Description: Project name for resource naming

  BedrockRegion:
    Type: String
    Default: us-west-2
    Description: AWS region for Bedrock services

  ClaudeModelId:
    Type: String
    Default: us.anthropic.claude-sonnet-4-20250514-v1:0
    Description: Bedrock Claude Sonnet 4 inference profile for reasoning and text generation

  SdxlModelId:
    Type: String
    Default: amazon.titan-image-generator-v2:0
    Description: Bedrock image generation model ID (Titan Image Generator v2)

  BedrockKnowledgeBaseId:
    Type: String
    Default: ""
    Description: Bedrock Knowledge Base ID (optional)

  BedrockAgentId:
    Type: String
    Default: ""
    Description: Bedrock Agent ID for AgentCore (optional)

  BedrockAgentAliasId:
    Type: String
    Default: ""
    Description: Bedrock Agent Alias ID for AgentCore (optional)

  EnableFallback:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Enable fallback to OpenAI/Gemini (true for dev, false for production)

Globals:
  Function:
    Runtime: python3.9
    Timeout: 180 # Increased for Bedrock API calls
    MemorySize: 2048 # Increased for better performance (more CPU)
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        PROJECT_NAME: !Ref ProjectName
        SESSIONS_TABLE: !Ref WorkflowSessionsTable
        S3_BUCKET: !Ref BrandingAssetsBucket
        S3_BUCKET_NAME: !Ref BrandingAssetsBucket
        LOG_LEVEL: INFO
        # Bedrock Configuration
        BEDROCK_REGION: !Ref BedrockRegion
        CLAUDE_MODEL_ID: !Ref ClaudeModelId
        SDXL_MODEL_ID: !Ref SdxlModelId
        BEDROCK_KB_ID: !Ref BedrockKnowledgeBaseId
        BEDROCK_AGENT_ID: !Ref BedrockAgentId
        BEDROCK_AGENT_ALIAS_ID: !Ref BedrockAgentAliasId
        ENABLE_FALLBACK: !Ref EnableFallback
        # Bedrock Throttle Protection
        BEDROCK_MAX_RETRIES: "3"
        BEDROCK_BASE_DELAY: "1.0"
        BEDROCK_MAX_DELAY: "30.0"
        BEDROCK_RATE_LIMIT_DELAY: "2.0"
    Layers:
      - !Ref SharedUtilitiesLayer

Resources:
  # API Gateway HTTP API (cost-optimized)
  BrandingApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      CorsConfiguration:
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
          - X-Amz-Date
          - X-Api-Key
          - X-Amz-Security-Token
        AllowOrigins:
          - "*"
      Tags:
        Environment: !Ref Environment
        Project: !Ref ProjectName

  # Shared Lambda Layer for common utilities
  SharedUtilitiesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "${ProjectName}-shared-utilities-${Environment}"
      Description: Shared utilities for all agent functions (SDXL Bedrock-only v2.3)
      ContentUri: src/lambda/layers/shared-utilities/
      CompatibleRuntimes:
        - python3.9
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: python3.9

  # IAM Policy for Bedrock Access
  BedrockAccessPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${ProjectName}-bedrock-access-${Environment}"
      Description: IAM policy for Amazon Bedrock access (Claude, SDXL, Knowledge Base, AgentCore)
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Bedrock Model Invocation (Claude, SDXL)
          - Sid: BedrockModelInvocation
            Effect: Allow
            Action:
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
              - bedrock:ListFoundationModels
              - bedrock:GetFoundationModel
            Resource:
              - !Sub "arn:aws:bedrock:*::foundation-model/*"
              - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*"

          # Bedrock Knowledge Base Access
          - Sid: BedrockKnowledgeBase
            Effect: Allow
            Action:
              - bedrock:Retrieve
              - bedrock:RetrieveAndGenerate
            Resource:
              - !Sub "arn:aws:bedrock:${BedrockRegion}:${AWS::AccountId}:knowledge-base/*"

          # Bedrock Agent Runtime (AgentCore)
          - Sid: BedrockAgentRuntime
            Effect: Allow
            Action:
              - bedrock-agent-runtime:InvokeAgent
              - bedrock-agent-runtime:Retrieve
            Resource:
              - !Sub "arn:aws:bedrock:${BedrockRegion}:${AWS::AccountId}:agent/*"
              - !Sub "arn:aws:bedrock:${BedrockRegion}:${AWS::AccountId}:agent-alias/*"

          # CloudWatch Logging & Metrics
          - Sid: CloudWatchAccess
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
              - cloudwatch:PutMetricData
            Resource: "*"

  # Agent Lambda Functions
  SupervisorAgent:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-supervisor-agent-${Environment}"
      CodeUri: src/lambda/agents/supervisor/
      Handler: index.lambda_handler
      Description: Supervisor Agent - Workflow monitoring and control
      Events:
        StatusApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref BrandingApi
            Path: /status/{id}
            Method: get
        SessionsApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref BrandingApi
            Path: /sessions
            Method: post
        SessionGetApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref BrandingApi
            Path: /sessions/{id}
            Method: get
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref WorkflowSessionsTable
        - S3ReadPolicy:
            BucketName: !Ref BrandingAssetsBucket
        - !Ref BedrockAccessPolicy
        # Allow Supervisor to invoke other Agent Lambda functions
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource:
                - !GetAtt ProductInsightAgent.Arn
                - !GetAtt ReporterAgent.Arn
                - !GetAtt SignboardAgent.Arn
                - !GetAtt InteriorAgent.Arn
                - !GetAtt ReportGeneratorAgent.Arn

  ProductInsightAgent:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-product-insight-agent-${Environment}"
      CodeUri: src/lambda/agents/product-insight/
      Handler: index.lambda_handler
      Description: Product Insight Agent - Business analysis
      Events:
        AnalysisApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref BrandingApi
            Path: /analysis
            Method: post
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref WorkflowSessionsTable
        - S3ReadPolicy:
            BucketName: !Ref BrandingAssetsBucket
        - !Ref BedrockAccessPolicy

  MarketAnalystAgent:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-market-analyst-agent-${Environment}"
      CodeUri: src/lambda/agents/market-analyst/
      Handler: index.lambda_handler
      Description: Market Analyst Agent - Market trends analysis
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref WorkflowSessionsTable
        - !Ref BedrockAccessPolicy

  ReporterAgent:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-reporter-agent-${Environment}"
      CodeUri: src/lambda/agents/reporter/
      Handler: index.lambda_handler
      Description: Reporter Agent - Business name suggestions
      Timeout: 180 # Increased for Bedrock API throttling and retries
      Events:
        NamesApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref BrandingApi
            Path: /names/suggest
            Method: post
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref WorkflowSessionsTable
        - !Ref BedrockAccessPolicy

  ReporterStatusAgent:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-reporter-status-agent-${Environment}"
      CodeUri: src/lambda/agents/reporter/
      Handler: status.lambda_handler
      Description: Reporter Status Agent - Check name generation status
      Events:
        StatusApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref BrandingApi
            Path: /names/status/{sessionId}
            Method: get
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref WorkflowSessionsTable

  SignboardAgent:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-signboard-agent-${Environment}"
      CodeUri: src/lambda/agents/signboard/
      Handler: index.lambda_handler
      Description: Signboard Agent - Signboard design generation
      Timeout: 60
      MemorySize: 3008 # Max CPU allocation for parallel image generation
      Environment:
        Variables:
          OPENAI_API_KEY: "{{resolve:secretsmanager:openai-api-key:SecretString:api_key}}"
          GEMINI_API_KEY: "{{resolve:secretsmanager:gemini-api-key:SecretString:api_key}}"
      Events:
        SignboardsGenerateApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref BrandingApi
            Path: /signboards/generate
            Method: post
        SignboardsSelectApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref BrandingApi
            Path: /signboards/select
            Method: post
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref WorkflowSessionsTable
        - S3CrudPolicy:
            BucketName: !Ref BrandingAssetsBucket
        - !Ref BedrockAccessPolicy
        - Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
                - lambda:InvokeAsync
              Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProjectName}-signboard-agent-${Environment}"
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:openai-api-key-*"
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:gemini-api-key-*"

  InteriorAgentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-interior-agent-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - !Ref BedrockAccessPolicy
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:DescribeTable
                Resource:
                  - !GetAtt WorkflowSessionsTable.Arn
                  - !Sub "${WorkflowSessionsTable.Arn}/index/*"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/InteriorData-${Environment}"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/InteriorData-${Environment}/index/*"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/branding-chatbot-sessions-*"
        - PolicyName: S3Access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !Sub "${BrandingAssetsBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  - !GetAtt BrandingAssetsBucket.Arn
        - PolicyName: LambdaSelfInvoke
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                  - lambda:InvokeAsync
                Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProjectName}-interior-agent-${Environment}"

  InteriorAgent:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-interior-agent-${Environment}"
      CodeUri: src/lambda/agents/interior/
      Handler: index.lambda_handler
      Description: Interior Agent - Interior design recommendations
      Timeout: 90
      MemorySize: 3008 # Max CPU allocation for parallel image generation
      Role: !GetAtt InteriorAgentRole.Arn
      Events:
        InteriorsApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref BrandingApi
            Path: /interiors/generate
            Method: post
        InteriorsSelectApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref BrandingApi
            Path: /interiors/select
            Method: post

  ReportGeneratorAgent:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-report-generator-agent-${Environment}"
      CodeUri: src/lambda/agents/report-generator/
      Handler: index.lambda_handler
      Description: Report Generator Agent - HTML report generation with extended timeout
      Timeout: 180
      MemorySize: 2048
      PackageType: Zip
      Events:
        ReportApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref BrandingApi
            Path: /report/generate
            Method: post
        ReportUrlApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref BrandingApi
            Path: /report/url
            Method: get
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref WorkflowSessionsTable
        - S3CrudPolicy:
            BucketName: !Ref BrandingAssetsBucket
        - !Ref BedrockAccessPolicy

  # DynamoDB Table for session management
  WorkflowSessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-sessions"
      AttributeDefinitions:
        - AttributeName: sessionId
          AttributeType: S
        - AttributeName: currentStep
          AttributeType: N
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: sessionId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      GlobalSecondaryIndexes:
        - IndexName: StepIndex
          KeySchema:
            - AttributeName: currentStep
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName

  # DynamoDB Table for Market Analysis dynamic data (Single Table Design)
  MarketAnalysisDataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-market-analysis"
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: dataType
          AttributeType: S
        - AttributeName: lastUpdated
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      GlobalSecondaryIndexes:
        - IndexName: DataTypeIndex
          KeySchema:
            - AttributeName: dataType
              KeyType: HASH
            - AttributeName: lastUpdated
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
        - Key: Purpose
          Value: MarketAnalystDynamicData

  # S3 Bucket for assets storage
  BrandingAssetsBucket:
    Type: AWS::S3::Bucket
    Properties:
      # BucketName을 지정하지 않으면 CloudFormation이 고유한 이름을 자동 생성
      # BucketName: !Sub "${ProjectName}-assets-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: DeleteIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: DeleteOldVersions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 30
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName

  # CloudWatch Log Groups for structured logging
  SupervisorAgentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${SupervisorAgent}"
      RetentionInDays: 14

  ProductInsightAgentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProductInsightAgent}"
      RetentionInDays: 14

  MarketAnalystAgentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${MarketAnalystAgent}"
      RetentionInDays: 14

  ReporterAgentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ReporterAgent}"
      RetentionInDays: 14

  SignboardAgentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${SignboardAgent}"
      RetentionInDays: 14

  InteriorAgentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${InteriorAgent}"
      RetentionInDays: 14

  ReportGeneratorAgentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ReportGeneratorAgent}"
      RetentionInDays: 14

Outputs:
  ApiEndpoint:
    Description: API Gateway HTTP API endpoint
    Value: !Sub "https://${BrandingApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
    Export:
      Name: !Sub "${ProjectName}-api-endpoint-${Environment}"

  DynamoDBTableName:
    Description: DynamoDB table name for sessions
    Value: !Ref WorkflowSessionsTable
    Export:
      Name: !Sub "${ProjectName}-dynamodb-table-${Environment}"

  S3BucketName:
    Description: S3 bucket name for assets
    Value: !Ref BrandingAssetsBucket
    Export:
      Name: !Sub "${ProjectName}-s3-bucket-${Environment}"
