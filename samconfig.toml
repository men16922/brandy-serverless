version = 0.1

# AWS-only architecture - Development environment configuration
[dev]
[dev.global]
[dev.global.parameters]
stack_name = "ai-branding-chatbot-dev"

[dev.build]
[dev.build.parameters]
cached = true
parallel = true

[dev.validate]
[dev.validate.parameters]
lint = true

[dev.deploy]
[dev.deploy.parameters]
capabilities = "CAPABILITY_IAM CAPABILITY_NAMED_IAM"
confirm_changeset = false
resolve_s3 = true
s3_prefix = "ai-branding-chatbot-dev"
region = "us-west-2"
parameter_overrides = "Environment=dev ProjectName=ai-branding-chatbot"
image_repositories = []

[dev.package]
[dev.package.parameters]
resolve_s3 = true

[dev.sync]
[dev.sync.parameters]
watch = true